name: ci

on:
  push:
    branches: [main, work]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # a warm pnpm store cache restores scriptc's toolchain without exec bits
      - run: find node_modules/.pnpm -path '*@scriptc+cli-*/dist/lib/*' -type f -exec chmod +x {} +
      - run: pnpm change check
      - run: node --test scripts/changelog-root.test.mjs
      - run: node scripts/check-published-list.mjs
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm smoke:pack
      - run: pnpm smoke:ws:ffi

  scriptc-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # a warm pnpm store cache restores scriptc's toolchain without exec bits
      - run: find node_modules/.pnpm -path '*@scriptc+cli-*/dist/lib/*' -type f -exec chmod +x {} +
      - run: pnpm -r build
      - run: scripts/scriptc-gate.sh
