name = "chttp-cloudflare-workers"
main = "src/main.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat", "enable_nodejs_fs_module"]

# The chttp router relies on node:http types in the Router. The
# `nodejs_compat` flag (compat date 2025-09-01+) provides them on
# Workerd. Without it, the IncomingMessage-shaped type imports in
# @chttp/router compile against the bundled ambient types and
# the surface slips.
#
# `enable_nodejs_fs_module` is required too: `multipart.ts` imports
# `node:fs` statically for DiskStorage, and `nodejs_compat` alone does
# not provide node:fs. On Workerd the flag mounts an in-memory
# filesystem, so DiskStorage resolves (ephemeral per isolate).
#
# `app.fetch` (Web Standards) is the entry point. Workerd calls
# the default export's `fetch(req, env, ctx)` handler; chttp's
# signature matches Hono's, so any Hono→chttp migration drops
# in by changing the import.
