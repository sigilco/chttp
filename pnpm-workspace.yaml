packages:
  - packages/*
  - examples/demo
  - examples/sse-clock
  - examples/ws-echo
  - examples/rate-limit
  - examples/backpressure
  - examples/integrations/*
  - bench
  - fixtures/*
allowBuilds:
  esbuild: true
  '@docmd/engine-rust': true
  scriptc: true
  workerd: true
minimumReleaseAgeExclude:
  - scriptc
  - '@scriptc/*'
  - unplugin-scriptc
versioning:
  ignore:
    - chttp-demo
    - chttp-example-backpressure
    - chttp-example-aws-lambda
    - chttp-example-cloudflare-workers
    - chttp-example-csr-react
    - chttp-example-hono-middleware
    - chttp-example-mcp-stdio
    - chttp-example-logging-file-audit
    - chttp-example-otlp-traces
    - chttp-example-prometheus-metrics
    - chttp-example-rate-limit
    - chttp-example-sse-clock
    - chttp-example-webhook-server
    - chttp-example-ws-echo
    - chttp-vite-fixture
  fixed:
    - ["@chttp/router", "@chttp/val", "@chttp/unplugin", "@chttp/static", "@chttp/ws", "@chttp/stream", "@chttp/html", "@chttp/auth", "@chttp/mcp"]
  changelog:
    storage: repository
